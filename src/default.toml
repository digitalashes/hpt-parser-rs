# The built-in output config: every record field as a column of its own, as read.
#
# Copy this file, change it and pass it with --config. Each [[column]] has a `name`,
# reads `from` one field (or a list of fields, joined by `|`) or is computed by a `plugin`
# function, and has a `type`: string, f64, i64, bool, date, json or list. The optional
# `transform` list runs in order before the cast; a value that does not cast is null.
#
# Transforms: "trim", "upper", "lower", "money" (drops `$`, `,` and spaces),
# { round = 2 }, { map = { ip = "inpatient" } }, { match = "setting", fuzzy = 0.8 }
# (domains: setting, methodology, code_type, drug_unit, billing_class),
# { split = "|" }, { default = "x" }, "codes_by_type", "codes_list", "hash",
# { plugin = "name.function" }.
#
# More fields: record.position and metadata.{layout, version, hospital_name,
# last_updated_on, location_name, hospital_address, license_number, license_state,
# type_2_npi, attestation, attestation_confirmed, attester_name}.

[output]
compression = "zstd:3"
row_group_size = 256000
chunk_size = 0

# Non-standard names a file may use for a CMS name: [aliases.csv] lists CSV column names
# (a wide file's payer-specific column without its payer and plan), [aliases.json] JSON
# member names. A file with both reads the CMS name.
[aliases.json]
modifier_code = ["modifiers"]

[[column]]
name = "charge_description"
from = "charge.description"
type = "string"

